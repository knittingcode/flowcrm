; FlowCRM pool settings, applied after the image defaults (listen = 9000).
[global]
error_log = /proc/self/fd/2
log_level = notice

[www]
; The master runs as www-data, so user/group are not used.
; Container environment (DATABASE_*, *_FILE) is passed to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
