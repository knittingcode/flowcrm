doctrine:
    dbal:
        default_connection: default
        types:
            inet: App\Shared\Infrastructure\Persistence\InetType
        connections:
            default:
                driver: pdo_pgsql
                host: '%env(DATABASE_HOST)%'
                port: '%env(int:DATABASE_PORT)%'
                dbname: '%env(DATABASE_NAME)%'
                user: '%env(DATABASE_USER)%'
                password: '%env(trim:file:DATABASE_PASSWORD_FILE)%'
                server_version: '18'
                charset: utf8
                profiling_collect_backtrace: '%kernel.debug%'
                mapping_types:
                    inet: inet
            # The application cache's own connection (config/packages/cache.yaml):
            # same database and credentials, opened only when the cache is
            # used. A failing cache query cannot abort a transaction of the
            # default connection, and RejectSchemaChanges keeps the cache
            # adapter from creating tables (migrations own the schema).
            cache:
                driver: pdo_pgsql
                host: '%env(DATABASE_HOST)%'
                port: '%env(int:DATABASE_PORT)%'
                dbname: '%env(DATABASE_NAME)%'
                user: '%env(DATABASE_USER)%'
                password: '%env(trim:file:DATABASE_PASSWORD_FILE)%'
                # Known version: the adapter needs no connection to detect the
                # platform, so an outage only turns reads into misses.
                server_version: '18'
                charset: utf8
                application_name: flowcrm_cache
                profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        # One mapping per module: entities live in <Module>/Domain (FCRM-003 section E).
        mappings:
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Infrastructure/Persistence'
                prefix: 'App\Shared\Infrastructure\Persistence'
                alias: Shared
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain'
                prefix: 'App\Identity\Domain'
                alias: Identity
            Organizations:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Organizations/Domain'
                prefix: 'App\Organizations\Domain'
                alias: Organizations
            Sales:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Sales/Domain'
                prefix: 'App\Sales\Domain'
                alias: Sales
            Audit:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Audit/Domain'
                prefix: 'App\Audit\Domain'
                alias: Audit

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
