# Exceptions for the container vulnerability gate (tests/app/scan.sh).
#
# The gate fails on every HIGH or CRITICAL finding in a runtime image. An
# entry here is allowed only for one specific CVE that cannot be fixed yet,
# under the id Trivy reports (the CVE, not an alias), with the evidence for
# the risk decision in `statement`, the affected package as `purls` with
# exact versions (one package per entry and one entry per package; Trivy
# then applies the entry only to those versions), the affected `paths`, and an
# `expired_at` date after today and no more than 90 days ahead, so the
# decision is reviewed again. From its expired_at day on, Trivy no longer
# applies the entry and scripts/ci/guard-trivyignore.sh fails until it is
# renewed after a new review or removed. Each entry is also listed in the
# Exceptions table of docs/security/container-vulnerabilities.md. No broad
# or permanent rules.
# An exception does not fix the vulnerable code; it only stops the gate
# from failing on that finding.
#
# Example:
#   vulnerabilities:
#     - id: CVE-0000-00000
#       paths: ["usr/bin/example"]
#       purls: ["pkg:golang/example.com/module@v1.2.3"]
#       statement: "Why it is not exploitable here, with evidence."
#       expired_at: 2026-12-31

vulnerabilities:
  - id: CVE-2026-116587
    paths: ["usr/bin/caddy"]
    purls: ["pkg:golang/github.com/go-jose/go-jose/v3@v3.0.5"]
    statement: "GHSA-mgcc-cww5-fp2q, go-jose/v3 v3.0.5 in the edge Caddy binary: no fixed v3 release exists (go-jose/v4 is upgraded to 4.1.6 and not covered). Not reachable: no acme_server, pki app or tls internal is configured and the admin API is off, enforced by the edge configuration guard. Decision proposed in ADR-021 (not accepted yet). Review on a fixed v3 release, smallstep or Caddy dropping v3, any change to docker/edge or tests/app/https, a severity change, a Trivy upgrade, or the expiry."
    expired_at: 2026-11-30
